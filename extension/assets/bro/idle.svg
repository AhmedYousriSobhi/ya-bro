<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Palette (light / dark): head #2EC4B6 / #45D9CB, cap #2B2D42 / #3A3D5C, ink #1E1E2E,
       halo #FFFFFF / #F0F0F5, accent #F5A524. Anchor: head bottom-centre (116,228). Faces right. -->
  <style>
    .halo{fill:none;stroke:#FFFFFF;stroke-width:18;stroke-linejoin:round}
    .body{fill:#2EC4B6;stroke:#1E1E2E;stroke-width:8}
    .cap{fill:#2B2D42;stroke:#1E1E2E;stroke-width:8;stroke-linejoin:round}
    .ink{fill:#1E1E2E}
    .line{fill:none;stroke:#1E1E2E;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
    .glint{fill:#FFFFFF}
    .fx{fill:#F5A524;stroke:#1E1E2E;stroke-width:5;stroke-linejoin:round}
    .fxl{fill:none;stroke:#1E1E2E;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
    @media (prefers-color-scheme:dark){.body{fill:#45D9CB}.cap{fill:#3A3D5C}.halo{stroke:#F0F0F5}.fxl{stroke:#F0F0F5}}
  </style>
  <title>Ya-Bro (Brim): idle</title>
  <g id="pose">
    <circle class="halo" cx="116" cy="156" r="72"/>
    <path class="halo" d="M44 140C44 96 76 66 116 66C156 66 186 94 188 128H214Q222 128 222 136V140Q222 148 214 148H44Z"/>
    <circle id="head" class="body" cx="116" cy="156" r="72"/>
    <path id="cap" class="cap" d="M44 140C44 96 76 66 116 66C156 66 186 94 188 128H214Q222 128 222 136V140Q222 148 214 148H44Z"/>
    <g id="eyes"><circle class="ink" cx="104" cy="178" r="11"/><circle class="glint" cx="108" cy="174" r="3.5"/><circle class="ink" cx="144" cy="178" r="11"/><circle class="glint" cx="148" cy="174" r="3.5"/></g>
    <path id="mouth" class="line" d="M116 206Q126 213 136 206"/>
    <g id="fx"></g>
  </g>
</svg>
