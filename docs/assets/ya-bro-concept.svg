<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 830" width="1400" height="830" font-family="Cantarell, 'DejaVu Sans', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#27344f"/><stop offset="1" stop-color="#4b3a70"/></linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#9b86ff" stop-opacity=".55"/><stop offset="1" stop-color="#9b86ff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1400" height="830" fill="#f4f1ea"/>
  <!-- desktop -->
  <rect width="1040" height="830" fill="url(#bg)"/>
  <rect width="1040" height="30" fill="#17171c"/>
  <text x="14" y="20" fill="#ddd" font-size="13">Activities</text>
  <text x="500" y="20" fill="#ddd" font-size="13">Fri 20 Nov  22:41</text>
  <circle cx="790" cy="15" r="5" fill="#35d07f"/>
  <text x="802" y="20" fill="#bfe9d2" font-size="12">bro: watching this app only</text>
  <rect x="1010" y="9" width="12" height="12" rx="2" fill="#555"/>

  <!-- browser window -->
  <rect x="40" y="50" width="620" height="440" rx="10" fill="#f6f5f4" stroke="#00000030"/>
  <path d="M40 60a10 10 0 0 1 10-10h600a10 10 0 0 1 10 10v26H40z" fill="#e6e4e1"/>
  <text x="270" y="73" font-size="13" fill="#444">workbench - Firefox</text>
  <rect x="40" y="86" width="620" height="38" fill="#1f2933"/>
  <text x="58" y="110" font-size="14" fill="#fff" font-weight="bold">workbench</text>
  <text x="170" y="110" font-size="13" fill="#aab4be">Architecture</text>
  <text x="274" y="110" font-size="13" fill="#fff" font-weight="bold">Scenarios</text>
  <text x="370" y="110" font-size="13" fill="#aab4be">Traffic</text>
  <!-- diagram -->
  <g font-size="12" fill="#222" stroke="#8a97a3">
    <path d="M130 190 L300 190 M130 190 L110 290 M130 190 L250 290 M300 190 L390 290" fill="none" stroke-width="2"/>
  </g>
  <g font-size="12" fill="#222">
    <rect x="85" y="168" width="90" height="44" rx="8" fill="#d6e4ff" stroke="#6b8ccf"/><text x="108" y="195">login</text>
    <rect x="255" y="168" width="90" height="44" rx="8" fill="#d6e4ff" stroke="#6b8ccf"/><text x="272" y="195">slurmctld</text>
    <rect x="65" y="290" width="90" height="44" rx="8" fill="#dff3e4" stroke="#5fae75"/><text x="88" y="317">cn001</text>
    <rect x="205" y="290" width="90" height="44" rx="8" fill="#dff3e4" stroke="#5fae75"/><text x="228" y="317">cn002</text>
    <rect x="345" y="290" width="90" height="44" rx="8" fill="#fde0dc" stroke="#d9625a"/><text x="368" y="317">cn003</text>
  </g>
  <rect x="470" y="150" width="170" height="210" rx="8" fill="#fff" stroke="#cfd5db"/>
  <text x="484" y="175" font-size="13" font-weight="bold" fill="#222">Node cn003</text>
  <text x="484" y="198" font-size="12" fill="#666">state: DOWN</text>
  <rect x="484" y="300" width="140" height="30" rx="6" fill="#d9625a"/><text x="526" y="320" font-size="13" fill="#fff">Power off</text>
  <!-- highlight ring on Scenarios tab -->
  <ellipse cx="302" cy="105" rx="56" ry="22" fill="none" stroke="#ffd23f" stroke-width="4"/>
  <ellipse cx="302" cy="105" rx="68" ry="29" fill="none" stroke="#ffd23f" stroke-width="2" stroke-opacity=".5"/>

  <!-- dotted trail avatar -> ring -->
  <path d="M684 160 C560 230 470 40 362 98" fill="none" stroke="#b6a6ff" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/>

  <!-- terminal -->
  <rect x="330" y="510" width="690" height="200" rx="10" fill="#1b1d21" stroke="#00000050"/>
  <path d="M330 520a10 10 0 0 1 10-10h670a10 10 0 0 1 10 10v22H330z" fill="#2b2e34"/>
  <text x="590" y="531" font-size="12" fill="#ccc">Ptyxis - benchctl</text>
  <g font-family="'DejaVu Sans Mono', monospace" font-size="12">
    <text x="346" y="566" fill="#9fe3a6">$ ./scripts/benchctl scenario run node-down</text>
    <text x="346" y="586" fill="#ff8f86">error: scenario needs a running cluster</text>
    <text x="346" y="612" fill="#9fe3a6">$ ./scripts/benchctl scenario run node-down</text>
    <text x="346" y="632" fill="#ff8f86">error: scenario needs a running cluster</text>
    <text x="346" y="658" fill="#9fe3a6">$ ./scripts/benchctl scenario ru</text>
  </g>
  <rect x="601" y="647" width="8" height="14" fill="#ddd"/>

  <!-- step card -->
  <rect x="40" y="510" width="270" height="200" rx="12" fill="#fffdf7" stroke="#e1d9c6"/>
  <text x="56" y="536" font-size="12" fill="#7a6a3a" font-weight="bold">SHOW ME  -  STEP 2 OF 4</text>
  <text x="56" y="566" font-size="16" fill="#222" font-weight="bold">Open the Scenarios tab</text>
  <text x="56" y="590" font-size="12" fill="#555">That is where node-down lives.</text>
  <text x="56" y="608" font-size="12" fill="#555">Click the highlighted tab.</text>
  <g font-size="12" fill="#222">
    <rect x="56" y="640" width="64" height="30" rx="15" fill="#efe9d9"/><text x="70" y="660">Next</text>
    <rect x="128" y="640" width="96" height="30" rx="15" fill="#7c5cff"/><text x="138" y="660" fill="#fff">Do it for me</text>
    <rect x="232" y="640" width="56" height="30" rx="15" fill="#f6d6d2"/><text x="244" y="660">Stop</text>
  </g>

  <!-- avatar -->
  <circle cx="700" cy="160" r="62" fill="url(#glow)"/>
  <circle cx="700" cy="160" r="30" fill="#7c5cff" stroke="#fff" stroke-width="3"/>
  <circle cx="690" cy="154" r="5" fill="#fff"/><circle cx="711" cy="154" r="5" fill="#fff"/>
  <circle cx="691" cy="155" r="2" fill="#222"/><circle cx="712" cy="155" r="2" fill="#222"/>
  <path d="M689 168 q11 9 22 0" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <path d="M700 130 v-14" stroke="#fff" stroke-width="3"/><circle cx="700" cy="113" r="4" fill="#ffd23f"/>
  <text x="676" y="212" font-size="12" fill="#e9e3ff" font-weight="bold">Ya-Bro</text>

  <!-- speech bubble -->
  <path d="M760 190 l-22 -20 v20 z" fill="#fff"/>
  <rect x="738" y="190" width="285" height="140" rx="14" fill="#fff"/>
  <text x="754" y="218" font-size="15" fill="#222" font-weight="bold">You stuck, bro?</text>
  <text x="754" y="240" font-size="12" fill="#555">Same command failed twice and you</text>
  <text x="754" y="256" font-size="12" fill="#555">hovered Scenarios 4 times. Cluster</text>
  <text x="754" y="272" font-size="12" fill="#555">is not started yet.</text>
  <rect x="754" y="288" width="110" height="28" rx="14" fill="#7c5cff"/><text x="772" y="307" font-size="12" fill="#fff">Yeah, help me</text>
  <rect x="872" y="288" width="140" height="28" rx="14" fill="#eceaf5"/><text x="882" y="307" font-size="12" fill="#333">No no, all good</text>
  <text x="738" y="352" font-size="11" fill="#d8d2f0" font-style="italic">If you say no: "I don't think so, but I'm here."</text>
  <text x="738" y="368" font-size="11" fill="#d8d2f0" font-style="italic">Then it backs off for a long while.</text>

  <!-- ask bar -->
  <rect x="40" y="740" width="980" height="56" rx="28" fill="#ffffffee"/>
  <circle cx="76" cy="768" r="18" fill="#7c5cff"/>
  <rect x="71" y="758" width="10" height="16" rx="5" fill="#fff"/><path d="M66 768 q10 14 20 0" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="108" y="773" font-size="15" fill="#777">Ask the bro...  "how do I run node-down?"  (text, or hold the key to talk)</text>
  <text x="880" y="773" font-size="13" fill="#999">EN  |  عربي</text>

  <!-- numbered callouts -->
  <g font-size="13" font-weight="bold" text-anchor="middle" fill="#fff">
    <circle cx="1034" cy="200" r="12" fill="#e5484d"/><text x="1034" y="205">1</text>
    <circle cx="250" cy="136" r="12" fill="#e5484d"/><text x="250" y="141">2</text>
    <circle cx="298" cy="522" r="12" fill="#e5484d"/><text x="298" y="527">3</text>
    <circle cx="1022" cy="740" r="12" fill="#e5484d"/><text x="1022" y="745">4</text>
    <circle cx="772" cy="15" r="11" fill="#e5484d"/><text x="772" y="20">5</text>
  </g>

  <!-- legend -->
  <text x="1066" y="52" font-size="20" font-weight="bold" fill="#222">Ya-Bro</text>
  <text x="1066" y="74" font-size="12" fill="#777">concept sketch - not a final design</text>
  <g font-size="13" fill="#333">
    <circle cx="1078" cy="112" r="11" fill="#e5484d"/><text x="1078" y="117" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
    <text x="1098" y="108" font-weight="bold">Proactive nudge</text>
    <text x="1098" y="126" font-size="12" fill="#555">Notices struggle (loops, repeated</text>
    <text x="1098" y="141" font-size="12" fill="#555">errors) and asks once, with humour.</text>
    <text x="1098" y="156" font-size="12" fill="#555">Backs off if you say no.</text>

    <circle cx="1078" cy="200" r="11" fill="#e5484d"/><text x="1078" y="205" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
    <text x="1098" y="196" font-weight="bold">Points at the real UI</text>
    <text x="1098" y="214" font-size="12" fill="#555">Ring + trail drawn over the live app,</text>
    <text x="1098" y="229" font-size="12" fill="#555">found via the accessibility tree.</text>

    <circle cx="1078" cy="272" r="11" fill="#e5484d"/><text x="1078" y="277" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
    <text x="1098" y="268" font-weight="bold">One step at a time</text>
    <text x="1098" y="286" font-size="12" fill="#555">Show me (you click) or Do it for me</text>
    <text x="1098" y="301" font-size="12" fill="#555">(bro clicks, narrated). Stop is instant.</text>

    <circle cx="1078" cy="344" r="11" fill="#e5484d"/><text x="1078" y="349" fill="#fff" text-anchor="middle" font-weight="bold">4</text>
    <text x="1098" y="340" font-weight="bold">Voice + text, Arabic + English</text>
    <text x="1098" y="358" font-size="12" fill="#555">Push-to-talk by default.</text>

    <circle cx="1078" cy="396" r="11" fill="#e5484d"/><text x="1078" y="401" fill="#fff" text-anchor="middle" font-weight="bold">5</text>
    <text x="1098" y="392" font-weight="bold">Visible, opt-in monitoring</text>
    <text x="1098" y="410" font-size="12" fill="#555">Per-app consent, local, content-free</text>
    <text x="1098" y="425" font-size="12" fill="#555">signals only, kill switch always on.</text>
  </g>
  <rect x="1060" y="460" width="320" height="1" fill="#d8d2c4"/>
  <text x="1066" y="488" font-size="13" font-weight="bold" fill="#222">Under the hood (per the ADRs)</text>
  <g font-size="12" fill="#555">
    <text x="1066" y="510">GNOME 50 Wayland first, KWin next</text>
    <text x="1066" y="528">Shell extension draws overlay, reports</text>
    <text x="1066" y="543">window positions</text>
    <text x="1066" y="563">Python core, AT-SPI, Claude for plans</text>
    <text x="1066" y="581">App packs: workbench is the first</text>
    <text x="1066" y="599">Shown: workbench web UI + terminal</text>
  </g>
</svg>
